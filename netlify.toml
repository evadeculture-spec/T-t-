# Site estático: a pasta site/ contém apenas os ficheiros públicos.
# Originais, capturas completas e o inventário de trabalho nunca entram nesta pasta.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/*.m4a"
  [headers.values]
    Content-Type = "audio/mp4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
